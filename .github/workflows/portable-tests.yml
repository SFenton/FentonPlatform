name: portable-tests
on:
  push:
  pull_request:
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.9"}
      - run: python -m unittest discover tooling/tests
      - run: python -m fenton_tooling check
        env: {PYTHONPATH: tooling/src}
      - run: python -m py_compile tooling/src/fenton_tooling/*.py
      - run: node tools/check-docs.mjs
